name: ATLAS Watchdog

# Gardien INDEPENDANT du PC: verifie chaque jour que les donnees sont fraiches
# et que le dashboard cloud repond. Alerte Telegram sinon, et redeploie
# automatiquement le dashboard s'il est plante (commit vide -> rebuild).

on:
  schedule:
    - cron: "0 10 * * *"     # tous les jours a 10h00 UTC (12h00 Paris l'ete)
  workflow_dispatch:          # declenchable a la main depuis l'onglet Actions
    inputs:
      mode:
        description: "surveillance = comme chaque jour | test = force un message Telegram de controle"
        type: choice
        options: [surveillance, test]
        default: test

permissions:
  contents: write             # necessaire pour le commit vide de redeploiement

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances minimales
        run: pip install --quiet requests psycopg2-binary

      - name: Verifier donnees + dashboard
        id: check
        env:
          ATLAS_CLOUD_DB: ${{ secrets.ATLAS_CLOUD_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python scripts/cloud_watchdog.py --test
          else
            python scripts/cloud_watchdog.py
          fi

      - name: Redeployer le dashboard si plante
        if: steps.check.outputs.app_down == 'true'
        run: |
          git config user.name "atlas-watchdog"
          git config user.email "watchdog@atlas.local"
          git commit --allow-empty -m "watchdog: redeploiement automatique du dashboard"
          git push

      # GitHub DESACTIVE les workflows planifies d'un depot reste 60 jours sans
      # activite. C'est arrive le 2026-11-08: le dernier commit datait du
      # 2026-09-09, et le gardien s'est eteint en silence, sans alerte. Un
      # commit vide suffit a remettre le compteur a zero (celui du 9 septembre
      # l'avait deja fait une fois sans qu'on le sache).
      - name: Garder le depot actif
        if: always()
        run: |
          dernier=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - dernier ) / 86400 ))
          echo "dernier commit il y a $age jours"
          if [ "$age" -ge 40 ]; then
            git config user.name "atlas-watchdog"
            git config user.email "watchdog@atlas.local"
            git commit --allow-empty -m "watchdog: maintien en activite du depot"
            git push
          fi
