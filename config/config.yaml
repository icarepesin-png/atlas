# Configuration centrale ATLAS. Toute ponderation / seuil vit ici, jamais en dur dans le code.

universe:
  # Indices actifs en MVP (resolus via atlas/universe/loader.py)
  indices: [sp500, nasdaq100, stoxx600_sample]
  min_dollar_volume: 5000000      # liquidite mini (USD / jour, moyenne 20j)
  min_price: 3.0                  # filtre penny stocks
  max_tickers: 1500               # plafond MVP (Yahoo). Polygon/Databento pour 10k+.

data:
  provider: yahoo                 # yahoo | polygon | databento
  cache_dir: data/cache
  history_years: 25               # backtests depuis 2000 quand l'historique existe
  fundamentals_provider: yahoo    # yahoo | fmp | edgar

scoring:
  # Ponderations du score composite (renormalisees automatiquement).
  #
  # REVISION DU 2026-08-27, apres l'audit du 26 aout (docs/BACKTEST.md):
  # - technical 0.25 -> 0. IC de -0.008 mesure sur 2010-2026 (841 mesures
  #   hebdomadaires, 534 titres): ce pilier n'a JAMAIS eu de pouvoir predictif.
  #   Le top 10% de son score rend 1.31% a 21 seances contre 1.48% pour
  #   l'univers entier (t = -2.23). Acheter le haut de ce score fait donc
  #   legerement pire que le hasard.
  # - macro 0.15 -> 0 et sentiment 0.10 -> 0: ces deux piliers valent la MEME
  #   valeur pour tous les titres (80 et 50). Ils ne participaient donc pas au
  #   classement, ils ne faisaient que diluer les piliers qui, eux, separent
  #   les titres. Le pilier macro garde tout son role ailleurs: il pilote
  #   l'exposition globale via detect_regime().exposure_modifier.
  # - le poids libere va au fondamental (seul IC positif mesure: +0.094) et au
  #   secteur. Combinaison la plus performante sur les donnees reelles:
  #   top 5% a +3.88% contre +2.67% pour l'univers.
  weights:
    fundamental: 0.70
    technical: 0.0
    macro: 0.0
    sector: 0.30
    sentiment: 0.0
  winsorize_pct: 0.02             # ecretage des outliers avant z-score
  sector_neutral: true            # ranking intra-secteur pour les facteurs fondamentaux

signals:
  # Seuil recalibre le 2026-08-27 EN MEME TEMPS que les ponderations, pour
  # conserver la MEME selectivite (2.8 signaux/jour en moyenne sur 47 scans).
  # Retirer macro et sentiment, figes pour tous les titres, etale la
  # distribution vers le haut: un meme titre obtient un composite plus eleve
  # sans etre meilleur. 85 aurait laisse passer 37 signaux par jour.
  # Ce n'est donc pas un assouplissement, c'est la meme exigence dans une
  # nouvelle echelle.
  min_composite_score: 96
  min_fundamental_score: 80
  min_technical_score: 0     # 80 -> 0: filtre desactive avec le pilier (audit du 26/08)
  min_sector_score: 70
  stop_atr_multiple: 2.0
  trailing_atr_multiple: 2.75    # 3.0 -> 2.75: stop suiveur un peu plus serre (verrouille plus de gains)
  take_profit_r: [1.5, 2.5, 4.0]  # TP1/TP2/TP3 en multiples de R
  take_profit_part: 0.3333        # fraction vendue au premier objectif (active le 2026-08-26)
  atr_period: 14

portfolio:
  # Delai de carence apres une sortie perdante sur un titre (2026-08-27).
  # Les 8 titres rachetes apres une perte pesaient -3 921 USD, soit 72% de la
  # perte totale: WDC traite 5 fois, EOG 4 fois, SNDK et STX 3 fois. Le
  # systeme rachetait ce qui venait de le faire sortir.
  cooldown_days: 20
  method: volatility_targeting    # equal_weight | inverse_vol | volatility_targeting | hrp
  target_volatility: 0.12         # vol annualisee cible du portefeuille
  max_positions: 25
  max_weight_per_position: 0.05
  max_weight_per_sector: 0.30     # 25 -> 30%: laisse entrer quelques titres de plus (signaux concentres en tech)
  kelly_cap: 0.25                 # fraction de Kelly maximale appliquee
  risk_per_trade: 0.005           # 0.75 -> 0.5%: positions plus petites, plus de noms tiennent sous le plafond

risk:
  max_portfolio_drawdown: 0.15    # au-dela: reduction de risque automatique
  drawdown_derisk_steps:          # paliers de reduction de l'exposition brute
    - { drawdown: 0.08, gross_exposure: 0.75 }
    - { drawdown: 0.12, gross_exposure: 0.50 }
    - { drawdown: 0.15, gross_exposure: 0.25 }
  max_position_drawdown: 0.20     # stop "catastrophe" par position
  max_avg_correlation: 0.70       # alerte si correlation moyenne du book depasse
  max_country_weight: 0.70
  rebalance_drift_threshold: 0.20 # rebalance si un poids derive de 20% en relatif

backtest:
  start: "2000-01-01"
  initial_capital: 100000
  commission_bps: 2               # 2 points de base par cote
  slippage_bps: 5
  spread_bps: 3
  rebalance: monthly              # daily | weekly | monthly
  benchmark: SPY

validation:
  walk_forward:
    train_years: 5
    test_years: 1
    step_years: 1
  monte_carlo:
    n_simulations: 1000
    block_size_days: 21

macro:
  fred_series:
    cpi: CPIAUCSL
    ppi: PPIACO
    unemployment: UNRATE
    gdp: GDPC1
    fed_funds: FEDFUNDS
    yield_curve_10y2y: T10Y2Y
    m2: M2SL
    industrial_production: INDPRO

sectors:
  # ETFs proxys pour la rotation sectorielle (momentum + force relative vs SPY)
  benchmark: SPY
  etfs:
    Technology: XLK
    AI: BOTZ
    Semiconductor: SMH
    Healthcare: XLV
    Energy: XLE
    Utilities: XLU
    Industrials: XLI
    Financials: XLF
    ConsumerDiscretionary: XLY
    ConsumerStaples: XLP
    Materials: XLB
    RealEstate: XLRE
    Communication: XLC

execution:
  broker: paper                   # paper | alpaca | ibkr
  order_type: limit
  limit_offset_bps: 10

sentiment_ghost:
  # Mode fantome: le LLM local note les titres chaque nuit, scores journalises
  # a POIDS NUL (jamais dans le composite). Validation par IC avant activation.
  enabled: true
  model: llama3.1:8b
  tickers_per_night: 30
  refresh_days: 7
